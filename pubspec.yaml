name: shuashuati_app
description: "刷刷题 - 支持Word/JSON导入"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # 状态管理
  flutter_bloc: ^8.1.3
  equatable: ^2.0.5

  share_plus: ^12.0.2        # 系统分享面板
  qr_flutter: ^4.1.0         # 生成二维码
  permission_handler: ^11.0.0 # 存储权限（导出文件用
  # 用于日期格式化
  intl: ^0.19.0
  # 本地存储
  hive_flutter: ^1.1.0
  hive: ^2.2.3
  #图片选择
  image_picker: ^1.0.7
  # 文件选择
  file_picker: ^8.1.0
  # 用于打开文件
  open_file: ^4.0.0
  # Word解析（新）
  doc_text_extractor: ^2.1.0
  # excel解析
  archive: ^4.0.7  # 解压 xlsx（zip格式）
  xml: ^6.6.1
  # flame引擎
  flame: ^1.37.0
  flame_bloc: ^1.11.0
  flame_audio: ^2.10.0
  pixel_ui: ^0.5.1
  google_fonts: ^8.1.0
  # 路径处理
  path_provider: ^2.1.1
  path: ^1.8.0
  # UI组件
  cupertino_icons: ^1.0.6
  shared_preferences: ^2.0.15
  excel_plus: ^0.0.3
  # 用于生成领域/房间/物品的唯一ID
  uuid: ^4.5.1
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  build_runner: ^2.4.6
  hive_generator: ^2.0.0
  flutter_launcher_icons: ^0.14.1
  archive: ^4.0.7
flutter:
  uses-material-design: true
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/app_icon.png"  # 你的图标路径，建议 1024x1024
  adaptive_icon_background: "#FFFFFF"      # Android 自适应图标背景色
  adaptive_icon_foreground: "assets/icon/app_icon_foreground.png"  # 可选