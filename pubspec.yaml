name: shuashuati_app
description: "题屿 - 支持Word/JSON导入"
publish_to: 'none'
version: 1.0.3+4

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # 状态管理
  flutter_bloc: ^9.1.1
  equatable: ^2.1.0

  share_plus: ^13.3.0          # 系统分享面板
  qr_flutter: ^4.1.0           # 生成二维码
  # 用于日期格式化
  intl: ^0.20.3
  # 本地存储（hive_ce = hive 社区维护版，二进制兼容 hive 2）
  hive_ce_flutter: ^2.3.4
  hive_ce: ^2.19.3
  # 图片选择
  image_picker: ^1.2.3
  # 文件选择
  file_picker: ^12.0.0
  # 用于打开文件
  open_file: ^4.0.0
  # Word解析
  doc_text_extractor: ^2.1.1
  # excel解析
  archive: ^4.1.0  # 解压 xlsx（zip格式）
  xml: ^7.0.1
  # flame引擎
  flame: ^1.38.0
  flame_bloc: ^1.12.24
  flame_audio: ^2.12.2
  pixel_ui: ^0.5.1
  google_fonts: ^8.2.1
  # 路径处理
  path_provider: ^2.1.6
  path: ^1.9.1
  # UI组件
  cupertino_icons: ^1.0.9
  shared_preferences: ^2.5.5
  # 用于生成领域/房间/物品的唯一ID
  uuid: ^4.6.0
  # 记账模块图表
  fl_chart: ^1.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  # 受 Flutter 3.44 的 flutter_test meta 1.18.0 pinning 限制，build_runner 最新兼容版为 2.15.x
  build_runner: ^2.15.1
  hive_ce_generator: ^1.11.2
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8

flutter_native_splash:
  color: "#ffffff"
  image: assets/icon/app_icon_foreground.png
  color_dark: "#121212"
  image_dark: assets/icon/app_icon_foreground.png
  android_12:
    color: "#ffffff"
    color_dark: "#121212"
    image: assets/icon/app_icon_foreground.png
    image_dark: assets/icon/app_icon_foreground.png
  fullscreen: true

flutter:
  uses-material-design: true
  assets:
    - assets/icon/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/app_icon.png"  # 你的图标路径，建议 1024x1024
  adaptive_icon_background: "#FFFFFF"      # Android 自适应图标背景色
  adaptive_icon_foreground: "assets/icon/app_icon_foreground.png"  # 可选
